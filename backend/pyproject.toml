[project]
name = "onconova"
version = "0.1.0"
description = "OncoNova AI: research prototype for oncology image analysis. Not a medical device."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Research use only; see README" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
  "nibabel>=5.2",
  "pydicom>=2.4",
  "SimpleITK>=2.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
# Deep-learning segmentation (3-D U-Net via MONAI). The app runs without it.
dl = ["torch>=2.2", "monai>=1.3"]
# Metadata queries and downloads from NCI Imaging Data Commons.
datasets = ["idc-index>=0.13"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onconova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
